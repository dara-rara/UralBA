version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: ural-ba
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      POSTGRES_DB: uralba
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5555
    command: ["postgres", "-p", "5555"]
    volumes:
      - project_data:/var/lib/postgresql/data

volumes:
  project_data:

# для запуска файла выполнить команду в терминале:
# docker compose up -d
# docker-compose restart